[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/pitdapat/Presentor-Flow"
publish = false

# Exact versions are pinned here (PLAN §3.10). Crates reference them with
# `<name>.workspace = true` so every crate uses the same version.
[workspace.dependencies]
presenter-core = { path = "crates/core" }

# core
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
thiserror = "=2.0.21"
directories = "=6.0.0"
tracing = "=0.1.44"

# app
eframe = "=0.36.2"
egui = "=0.36.2"
tracing-subscriber = "=0.3.23"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

# dev
tempfile = "=3.27.0"
egui_kittest = "=0.36.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Faster debug builds: no debug info for third-party crates (egui, wgpu, ...).
# Our own crates keep full debug info, so backtraces still point at our code.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
